[package]
name = "hm_driver_rs"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
publish = true
description = "基于 HDC 和 UITest 的原生 Rust HarmonyOS UI 自动化驱动"
authors = ["shenjackyuanjie"]
repository = "https://github.com/shenjackyuanjie/hm_driver_rs"
homepage = "https://github.com/shenjackyuanjie/hm_driver_rs"
documentation = "https://docs.rs/hm_driver_rs"
readme = "README.md"
keywords = ["harmonyos", "ui-testing", "automation", "hdc", "uitest"]
categories = ["development-tools::testing"]
license = "Apache-2.0"

[features]
default = ["blocking", "embedded-agents"]
# 阻塞门面使用进程级多线程 runtime；异步核心使用 rt。
blocking = ["tokio/rt-multi-thread"]
embedded-agents = ["dep:directories"]

[dependencies]
directories = { version = "6", optional = true }
regex = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Agent 校验使用 SHA-256，按需启用基础哈希实现。
sha2 = { version = "0.11", default-features = false }
sxd-document = "0.3"
sxd-xpath = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "rt", "sync", "time"] }
# 日志使用事件宏和 std。
tracing = { version = "0.1", default-features = false, features = ["std"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
